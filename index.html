<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  componentDidMount() {
    const rows = document.querySelectorAll('[data-project-row]');
    rows.forEach(row => {
      const thumb = row.querySelector('[data-thumb]');
      row.addEventListener('mouseenter', () => {
        if (thumb) {
          thumb.style.opacity = '1';
          thumb.style.transform = 'translate(-50%, -50%) scale(1)';
        }
      });
      row.addEventListener('mouseleave', () => {
        if (thumb) {
          thumb.style.opacity = '0';
          thumb.style.transform = 'translate(-50%, -50%) scale(0.95)';
        }
      });
    });
    this._runTypewriter();
  }
  _runTypewriter() {
    const lines = [
      "Hi, I'm Soyoung, a designer.",
      "who likes to a new experience",
      "and all lovely things."
    ];
    const speed = 45;
    const lineDelay = 150;
    let lineIdx = 0;
    let charIdx = 0;
    const typeLine = () => {
      const el = document.querySelector('[data-type-line="' + lineIdx + '"]');
      if (!el) return;
      if (charIdx <= lines[lineIdx].length) {
        el.textContent = lines[lineIdx].slice(0, charIdx);
        charIdx++;
        setTimeout(typeLine, speed);
      } else {
        lineIdx++;
        charIdx = 0;
        if (lineIdx < lines.length) {
          setTimeout(typeLine, lineDelay);
        }
      }
    };
    setTimeout(typeLine, 400);
  }
  renderVals() { return {}; }
}

</script>
